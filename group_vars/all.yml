---
# --- Cluster auth ---
# Leave these unset to use the current `oc login` session / default kubeconfig.
# Set them (e.g. via --extra-vars, env, or an Ansible Vault file) to connect
# explicitly instead, such as from AAP/AWX or CI.
# The `true` 2nd arg to default() also substitutes on empty string, not just
# "undefined" — the env lookup returns '' (not undefined) when a var isn't
# set, which default() alone doesn't catch.
k8s_host: "{{ lookup('env', 'K8S_AUTH_HOST') | default(omit, true) }}"
k8s_api_key: "{{ lookup('env', 'K8S_AUTH_API_KEY') | default(omit, true) }}"
k8s_validate_certs: "{{ lookup('env', 'K8S_AUTH_VERIFY_SSL') | default(true, true) }}"

# --- VM identity ---
vm_name: demo-vm-01
vm_namespace: ansible-demo           # shared with create_container.yml / teardown.yml
create_namespace: true
vm_running: true

# --- Teardown bookkeeping ---
# Everything this playbook creates is labeled app.kubernetes.io/managed-by=<demo_label>
# so teardown.yml can find and remove it by label.
demo_label: ansible-virt-demo

# --- Sizing: instance type + preference, used by create_vm.yml ---
vm_instancetype: u1.medium          # see: oc get virtualmachineclusterinstancetypes
vm_preference: centos.stream9       # see: oc get virtualmachineclusterpreferences

# --- Sizing: explicit CPU/memory, used by create_vm_custom.yml ---
vm_cpu_cores: 1
vm_memory: 2Gi

# --- Boot source (golden image shipped with OpenShift Virtualization) ---
vm_datasource: centos-stream9
vm_datasource_namespace: openshift-virtualization-os-images
vm_disk_size: 30Gi

# --- cloud-init access ---
cloud_user: cloud-user
ssh_authorized_key: "ssh-ed25519 AAAA...replace-with-your-public-key... user@host"
